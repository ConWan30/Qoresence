[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qoresence"
version = "0.1.0-dev"
description = "Local game-state capture and Twitch ClutchBot MVP for streamers"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Qoresence Contributors"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
streamer = [
    "opencv-python>=4.8",
    "websockets>=12.0",
]
controller = [
    "hidapi>=0.14",
]
screen = [
    "mss>=10.0",
    "opencv-python>=4.8",
]
visual = [
    "requests>=2.31",
    "onnxruntime>=1.16",
    "opencv-python>=4.8",
]
local = [
    "onnxruntime>=1.16",
    "opencv-python>=4.8",
]
game = [
    "easyocr>=1.7",
    "paddlepaddle>=2.6",
    "paddleocr>=2.7",
    "ultralytics>=8.0",
    "onnxruntime-openvino>=1.24.1",
    "openvino==2025.4.1",
    "mediapipe>=0.10",
    "pygrabber>=0.2",
]
trio = [
    "trio-retina>=0.3.0",
    "wasmtime>=16.0",
    "prometheus-client>=0.19",
]
twitch = [
    "requests>=2.31",
    "websockets>=12.0",
]
monitor = [
    "opencv-python>=4.8",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.3",
    "mypy>=1.5",
]
all = [
    "opencv-python>=4.8",
    "websockets>=12.0",
    "hidapi>=0.14",
    "mss>=10.0",
    "requests>=2.31",
    "onnxruntime>=1.16",
    "easyocr>=1.7",
    "paddlepaddle>=2.6",
    "paddleocr>=2.7",
    "ultralytics>=8.0",
    "onnxruntime-openvino>=1.24.1",
    "openvino==2025.4.1",
    "mediapipe>=0.10",
    "pygrabber>=0.2",
    "trio-retina>=0.3.0",
    "wasmtime>=16.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qoresence*"]

[project.scripts]
qoresence = "qoresence.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]
per-file-ignores = { "scripts/*" = ["T20"], "qoresence/vision/distill.py" = ["T20"], "eval/*" = ["T20"] }

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
