<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<title>Qoresence Glass</title>
<style>
:root{--bg:#05080a;--ink:#e8f2ec;--dim:#7a8c82;--lime:#c6f26a;--cyan:#4fe0d4;--amber:#ffc14a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;position:relative;background:#000;min-height:40vh}
#mjpeg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#badge{position:absolute;left:10px;top:10px;z-index:2;font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;background:rgba(8,11,16,.78);border:1px solid rgba(198,242,106,.35);border-radius:999px;padding:7px 11px}
#badge.fb{border-color:rgba(255,193,74,.45);color:var(--amber)}
#badge.clutch{border-color:var(--lime);color:var(--lime);animation:flash 0.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--lime)}100%{box-shadow:0 0 20px 4px transparent}}
#strip{flex:0 0 auto;padding:10px 14px 14px;background:linear-gradient(180deg,rgba(5,8,10,.2),#05080a)}
#prov{font:600 10px/1.3 ui-monospace,monospace;color:var(--dim);letter-spacing:.04em;margin-bottom:8px}
#row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
#score{font:800 22px/1 Syne,system-ui,sans-serif;letter-spacing:-.03em}
#meta{font:600 12px/1.3 ui-monospace,monospace;color:var(--dim)}
#meta strong{color:var(--lime);font-weight:700}
#wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:600 14px/1.45 system-ui;color:var(--ink);background:rgba(5,8,10,.72);z-index:3}
#wait.hide{display:none}
#wait small{display:block;margin-top:8px;color:var(--dim);font-size:12px}
#pair{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:var(--bg);z-index:5;gap:18px}
#pair.hide{display:none}
#pair h1{font:800 26px/1.1 Syne,system-ui,sans-serif;letter-spacing:-.03em;color:var(--lime)}
#pair p{font:500 13px/1.5 system-ui;color:var(--dim);max-width:320px}
#pair .dot{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
#pair .host-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
#pair .host-item{font:700 15px/1.3 ui-monospace,monospace;color:var(--cyan);background:rgba(79,224,212,.08);border:1px solid rgba(79,224,212,.3);border-radius:10px;padding:12px 16px;cursor:pointer;text-align:left}
#pair .host-item:active{background:rgba(79,224,212,.15)}
#pair button{font:700 14px/1 system-ui;color:var(--bg);background:var(--lime);border:none;border-radius:999px;padding:14px 28px;letter-spacing:.02em;cursor:pointer}
#pair button:active{transform:translateY(1px)}
#pair input{font:600 15px/1 ui-monospace,monospace;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(198,242,106,.25);border-radius:10px;padding:12px 14px;width:220px;text-align:center}
#pair .manual{display:none;flex-direction:column;gap:12px;align-items:center}
#pair.show-manual .manual{display:flex}
#pair .switch{font:600 12px/1 system-ui;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none;padding:4px}
#pair .rescan{font:600 12px/1 system-ui;color:var(--cyan);background:none;border:none;padding:4px;cursor:pointer}
</style>
</head>
<body>
<div id="pair" class="hide">
  <h1>Qoresence Glass</h1>
  <div id="pairStatus"><span class="dot"></span></div>
  <p id="pairMsg">Scanning Wi-Fi for Qoresence…</p>
  <div class="host-list" id="pairHosts"></div>
  <div class="manual" id="pairManual">
    <input id="pairInput" type="text" inputmode="decimal" placeholder="192.168.1.10:8765" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="pairManualGo">Connect manually</button>
  </div>
  <div style="display:flex;gap:20px">
    <button class="switch" id="pairToggleManual">Enter address manually</button>
    <button class="rescan" id="pairRescan">Rescan</button>
  </div>
</div>
<div id="stage">
  <div id="badge">CONNECTING</div>
  <img id="mjpeg" alt="LIVE" decoding="async">
  <div id="wait">Waiting for FrameHub…<small>Run --play --deck on the PC. Phone is view only.</small></div>
</div>
<div id="strip">
  <div id="prov">Qoresence Glass · native</div>
  <div id="row">
    <div id="score">—</div>
    <div id="meta">frame <strong id="hasf">—</strong> · title <strong id="title">—</strong> · lock <strong id="lock">—</strong></div>
  </div>
</div>
<script>
// === Capacitor native plugin handles ===
const Cap = window.Capacitor;
const Haptics = Cap ? Cap.Plugins.Haptics : null;
const App = Cap ? Cap.Plugins.App : null;
const QoreMdns = Cap ? Cap.Plugins.QoreMdns : null;
const QoreBackground = Cap ? Cap.Plugins.QoreBackground : null;
const isNative = Cap && Cap.isNativePlatform && Cap.isNativePlatform();

// === State ===
const stage = document.getElementById('stage');
const mjpeg = document.getElementById('mjpeg');
const badge = document.getElementById('badge');
const wait = document.getElementById('wait');
const scoreEl = document.getElementById('score');
const hasf = document.getElementById('hasf');
const titleEl = document.getElementById('title');
const lockEl = document.getElementById('lock');
let hostUrl = '';          // e.g. http://192.168.1.26:8765
let lastClimax = 0;        // dedupe clutch haptics
let lastNotifiedClimax = 0;
let appBackgrounded = false;

function setBadge(text, cls) {
  badge.textContent = text;
  badge.className = cls || '';
}
function showWait(on) { wait.classList.toggle('hide', !on); }

function sitFrom(m) {
  if (!m || typeof m !== 'object') return {};
  if (m.situation && typeof m.situation === 'object') return m.situation;
  if (m.payload && typeof m.payload === 'object') return m.payload;
  return m;
}

function paintStrip(snap) {
  const s = sitFrom(snap);
  const vid = snap && snap.video ? snap.video : {};
  const hf = !!(vid.has_frame || s.has_frame);
  hasf.textContent = hf ? 'yes' : '—';
  const prof = s.game_profile || s.game_title || '';
  titleEl.textContent = prof ? String(prof) : '—';
  const locked = !!(s.score_vlm_locked || s.scoreboard_locked || s.title_claim);
  lockEl.textContent = locked ? 'locked' : '—';
  const hs = s.home_score, as = s.away_score;
  if (hs != null && as != null && locked) {
    scoreEl.textContent = hs + ' – ' + as;
  } else {
    scoreEl.textContent = '—';
  }
  if (hf) showWait(false);

  // === Clutch detection → haptics + notifications ===
  const coupling = snap && snap.coupling ? snap.coupling : {};
  const climax = coupling.climax_score || coupling.coupling || 0;
  const phrase = coupling.phrase || '';
  // Fire haptic when climax crosses 0.4 and it's a new peak
  if (climax > 0.4 && climax > lastClimax + 0.05) {
    lastClimax = climax;
    fireClutch(phrase, climax);
  }
  // Reset when drive ends
  if (phrase === 'IDLE' && lastClimax > 0) {
    lastClimax = 0;
  }
}

function fireClutch(phrase, score) {
  setBadge('CLUTCH · ' + phrase, 'clutch');
  // Haptic
  if (Haptics) {
    Haptics.impact({ style: 'HEAVY' }).catch(() => {});
  }
  // Local notification when backgrounded (native QoreBackground.notify)
  if (appBackgrounded && QoreBackground && score > lastNotifiedClimax + 0.1) {
    lastNotifiedClimax = score;
    QoreBackground.notify({
      title: 'Clutch moment',
      body: phrase + ' · climax ' + score.toFixed(2),
      id: Date.now() % 100000
    }).catch(() => {});
  }
}

// === Live situation polling ===
async function pollSit() {
  if (!hostUrl) return;
  try {
    const r = await fetch(hostUrl + '/api/situation');
    paintStrip(await r.json());
  } catch (e) {}
}

// === MJPEG video stream ===
function startMjpeg() {
  if (!hostUrl) return;
  setBadge('CONNECTING');
  mjpeg.src = hostUrl + '/video?fps=20&t=' + Date.now();
  mjpeg.onload = () => {
    setBadge('LIVE · MJPEG');
    showWait(false);
  };
  mjpeg.onerror = () => {
    setBadge('RECONNECTING', 'fb');
    setTimeout(startMjpeg, 2000);
  };
}

// === App lifecycle — track background for notification gating ===
if (App) {
  App.addListener('appStateChange', ({ isActive }) => {
    appBackgrounded = !isActive;
    if (isActive && QoreBackground) {
      QoreBackground.stopForeground().catch(() => {});
    } else if (!isActive && QoreBackground && hostUrl) {
      QoreBackground.startForeground({ url: hostUrl }).catch(() => {});
    }
  });
}

// === Pairing flow ===
const pair = document.getElementById('pair');
const pairMsg = document.getElementById('pairMsg');
const pairHosts = document.getElementById('pairHosts');
const pairToggle = document.getElementById('pairToggleManual');
const pairManualGo = document.getElementById('pairManualGo');
const pairInput = document.getElementById('pairInput');
const pairRescan = document.getElementById('pairRescan');

function connectToHost(hostPort) {
  // hostPort = "192.168.1.26:8765"
  hostUrl = 'http://' + hostPort;
  localStorage.setItem('qoresence_host', hostPort);
  pair.classList.add('hide');
  startMjpeg();
  pollSit();
  setInterval(pollSit, 1500);
}

function addHostButton(name, host, port) {
  const item = document.createElement('div');
  item.className = 'host-item';
  item.textContent = name || (host + ':' + port);
  item.onclick = () => connectToHost(host + ':' + port);
  pairHosts.appendChild(item);
}

async function scanMdns() {
  pairHosts.innerHTML = '';
  pairMsg.textContent = 'Scanning Wi-Fi for Qoresence…';
  pair.classList.remove('show-manual');

  if (QoreMdns) {
    // Native mDNS — discovers all Qoresence instances on the LAN
    try {
      const result = await QoreMdns.discover({ timeoutMs: 3000 });
      const hosts = result.hosts || [];
      if (hosts.length > 0) {
        pairMsg.textContent = hosts.length + ' Qoresence found on Wi-Fi.';
        hosts.forEach(h => addHostButton(h.name, h.host, h.port));
      } else {
        pairMsg.textContent = 'No Qoresence found. Start --play --deck on the PC, or enter address manually.';
        pair.classList.add('show-manual');
      }
    } catch (e) {
      pairMsg.textContent = 'Scan failed. Enter the PC address manually.';
      pair.classList.add('show-manual');
    }
  } else {
    // Fallback: no native mDNS (browser/PWA mode) — manual entry only
    pairMsg.textContent = 'Manual pairing. Enter the PC address shown on the Deck.';
    pair.classList.add('show-manual');
  }
}

pairToggle.onclick = () => pair.classList.toggle('show-manual');
pairManualGo.onclick = () => {
  const v = (pairInput.value || '').trim();
  if (v) connectToHost(v);
};
pairRescan.onclick = scanMdns;

// === Boot ===
(function boot() {
  const stored = localStorage.getItem('qoresence_host') || '';
  if (stored) {
    connectToHost(stored);
  } else {
    pair.classList.remove('hide');
    scanMdns();
  }
})();
</script>
</body>
</html>
