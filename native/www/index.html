<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<title>Qoresence Glass</title>
<style>
:root{--bg:#05080a;--ink:#e8f2ec;--dim:#7a8c82;--lime:#c6f26a;--cyan:#4fe0d4;--amber:#ffc14a;--red:#ff5a6a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;position:relative;background:#000;min-height:40vh}
#feed{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#badge{position:absolute;left:10px;top:10px;z-index:2;font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;background:rgba(8,11,16,.78);border:1px solid rgba(198,242,106,.35);border-radius:999px;padding:7px 11px}
#badge.fb{border-color:rgba(255,193,74,.45);color:var(--amber)}
#badge.clutch{border-color:var(--lime);color:var(--lime);animation:flash .6s ease}
#why{position:absolute;left:10px;right:10px;bottom:12px;z-index:2;font:600 12px/1.35 system-ui;color:var(--ink);background:rgba(8,11,16,.72);border:1px solid rgba(198,242,106,.2);border-radius:10px;padding:8px 10px;display:none}
#why.show{display:block}
#heat{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:2}
#heat>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime),var(--amber));transition:width .25s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--lime)}100%{box-shadow:0 0 20px 4px transparent}}
#strip{flex:0 0 auto;padding:10px 14px 12px;background:linear-gradient(180deg,rgba(5,8,10,.2),#05080a)}
#prov{font:600 10px/1.3 ui-monospace,monospace;color:var(--dim);letter-spacing:.04em;margin-bottom:8px}
#row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
#score{font:800 22px/1 system-ui,sans-serif;letter-spacing:-.03em}
#meta{font:600 12px/1.3 ui-monospace,monospace;color:var(--dim)}
#meta strong{color:var(--lime);font-weight:700}
#acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#acts button{font:700 11px/1 system-ui;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(198,242,106,.25);border-radius:999px;padding:8px 12px}
#acts button:active{transform:translateY(1px)}
#wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:600 14px/1.45 system-ui;color:var(--ink);background:rgba(5,8,10,.72);z-index:3}
#wait.hide{display:none}
#wait small{display:block;margin-top:8px;color:var(--dim);font-size:12px}
#pair{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:var(--bg);z-index:5;gap:18px}
#pair.hide{display:none}
#pair h1{font:800 26px/1.1 system-ui,sans-serif;letter-spacing:-.03em;color:var(--lime)}
#pair p{font:500 13px/1.5 system-ui;color:var(--dim);max-width:320px}
#pair .dot{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
#pair .host-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
#pair .host-item{font:700 15px/1.3 ui-monospace,monospace;color:var(--cyan);background:rgba(79,224,212,.08);border:1px solid rgba(79,224,212,.3);border-radius:10px;padding:12px 16px;cursor:pointer;text-align:left}
#pair button{font:700 14px/1 system-ui;color:var(--bg);background:var(--lime);border:none;border-radius:999px;padding:14px 28px;letter-spacing:.02em;cursor:pointer}
#pair input{font:600 15px/1 ui-monospace,monospace;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(198,242,106,.25);border-radius:10px;padding:12px 14px;width:220px;text-align:center}
#pair .manual{display:none;flex-direction:column;gap:12px;align-items:center}
#pair.show-manual .manual{display:flex}
#pair .switch,#pair .rescan{font:600 12px/1 system-ui;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none;padding:4px}
#pair .rescan{color:var(--cyan)}
body.pip #strip,body.pip #acts,body.pip #wait{display:none}
body.pip #why{font-size:10px;padding:4px 6px}
</style>
</head>
<body>
<div id="pair" class="hide">
  <h1>Qoresence Glass</h1>
  <div id="pairStatus"><span class="dot"></span></div>
  <p id="pairMsg">Scanning Wi-Fi for Qoresence…</p>
  <div class="host-list" id="pairHosts"></div>
  <div class="manual" id="pairManual">
    <input id="pairInput" type="text" inputmode="decimal" placeholder="192.168.1.10:8765" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="pairManualGo">Connect manually</button>
  </div>
  <div style="display:flex;gap:20px">
    <button class="switch" id="pairToggleManual">Enter address manually</button>
    <button class="rescan" id="pairRescan">Rescan</button>
  </div>
</div>
<div id="stage">
  <div id="badge">CONNECTING</div>
  <img id="feed" alt="LIVE" decoding="async">
  <div id="why"></div>
  <div id="heat"><i id="heatBar"></i></div>
  <div id="wait">Waiting for FrameHub…<small>Run --play --deck --deck-bind 0.0.0.0 on the PC. Phone is view only.</small></div>
</div>
<div id="strip">
  <div id="prov">Qoresence Glass · cinema · same Wi-Fi only</div>
  <div id="row">
    <div id="score">—</div>
    <div id="meta">frame <strong id="hasf">—</strong> · title <strong id="title">—</strong> · lock <strong id="lock">—</strong> · <strong id="phrase">IDLE</strong></div>
  </div>
  <div id="acts">
    <button id="btnPair">Switch PC</button>
    <button id="btnPip">Pop-out</button>
    <button id="btnClip">Save clip</button>
  </div>
</div>
<script>
const Cap = window.Capacitor;
const Haptics = Cap && Cap.Plugins ? Cap.Plugins.Haptics : null;
const App = Cap && Cap.Plugins ? Cap.Plugins.App : null;
const QoreMdns = Cap && Cap.Plugins ? Cap.Plugins.QoreMdns : null;
const QoreBackground = Cap && Cap.Plugins ? Cap.Plugins.QoreBackground : null;
const QoreCinema = Cap && Cap.Plugins ? Cap.Plugins.QoreCinema : null;

const feed = document.getElementById('feed');
const badge = document.getElementById('badge');
const wait = document.getElementById('wait');
const scoreEl = document.getElementById('score');
const hasf = document.getElementById('hasf');
const titleEl = document.getElementById('title');
const lockEl = document.getElementById('lock');
const phraseEl = document.getElementById('phrase');
const whyEl = document.getElementById('why');
const heatBar = document.getElementById('heatBar');
let hostUrl = '';
let lastClimax = 0;
let lastNotifiedClimax = 0;
let appBackgrounded = false;
let sitTimer = 0;
let frameTimer = 0;
let inflight = false;
let lastBlob = '';
let inPip = false;

function setBadge(text, cls) {
  badge.textContent = text;
  badge.className = cls || '';
}
function showWait(on) { wait.classList.toggle('hide', !on); }
function sitFrom(m) {
  if (!m || typeof m !== 'object') return {};
  if (m.situation && typeof m.situation === 'object') return m.situation;
  if (m.payload && typeof m.payload === 'object') return m.payload;
  return m;
}
function couplingOf(snap) {
  if (snap && snap.coupling && typeof snap.coupling === 'object') return snap.coupling;
  if (snap && snap.controller && typeof snap.controller === 'object') return snap.controller;
  return {};
}

function paintStrip(snap) {
  const s = sitFrom(snap);
  const vid = snap && snap.video ? snap.video : {};
  const hf = !!(vid.has_frame || s.has_frame);
  hasf.textContent = hf ? 'yes' : '—';
  const prof = s.game_profile || s.game_title || '';
  titleEl.textContent = prof ? String(prof) : '—';
  const locked = !!(s.score_vlm_locked || s.scoreboard_locked || s.title_claim);
  lockEl.textContent = locked ? 'locked' : '—';
  const hs = s.home_score, as = s.away_score;
  scoreEl.textContent = (hs != null && as != null && locked) ? (hs + ' – ' + as) : '—';
  if (hf) showWait(false);

  const coupling = couplingOf(snap);
  const climax = Number(coupling.climax_score || coupling.coupling || 0) || 0;
  const phrase = coupling.phrase || 'IDLE';
  phraseEl.textContent = phrase;
  heatBar.style.width = Math.max(0, Math.min(100, climax * 100)) + '%';

  const why = snap && snap.timeline && snap.timeline.why_last;
  const line = why && why.line ? String(why.line) : '';
  if (line) {
    whyEl.textContent = line;
    whyEl.classList.add('show');
  } else {
    whyEl.classList.remove('show');
  }

  if (climax > 0.4 && climax > lastClimax + 0.05) {
    lastClimax = climax;
    fireClutch(phrase, climax);
  }
  if (phrase === 'IDLE' && lastClimax > 0) lastClimax = 0;
}

function fireClutch(phrase, score) {
  setBadge('CLUTCH · ' + (phrase || 'DRIVE'), 'clutch');
  if (Haptics) Haptics.impact({ style: 'HEAVY' }).catch(() => {});
  if (appBackgrounded && QoreBackground && score > lastNotifiedClimax + 0.1) {
    lastNotifiedClimax = score;
    QoreBackground.notify({
      title: 'Clutch moment',
      body: (phrase || 'drive') + ' · climax ' + score.toFixed(2),
      id: Date.now() % 100000
    }).catch(() => {});
  }
}

async function pollSit() {
  if (!hostUrl) return;
  try {
    const r = await fetch(hostUrl + '/api/situation', { cache: 'no-store' });
    paintStrip(await r.json());
  } catch (e) {}
}

function setPipUi(on) {
  inPip = !!on;
  document.body.classList.toggle('pip', inPip);
}

async function pumpFrame() {
  // Keep pumping in PiP: document.hidden is true in the overlay, but
  // the WebView is still the glass the operator is watching.
  if (!hostUrl || inflight) return;
  if (document.hidden && !inPip) return;
  inflight = true;
  try {
    const r = await fetch(hostUrl + '/live.jpg?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('no frame');
    const blob = await r.blob();
    if (lastBlob) URL.revokeObjectURL(lastBlob);
    lastBlob = URL.createObjectURL(blob);
    feed.src = lastBlob;
    setBadge('LIVE · CINEMA');
    showWait(false);
  } catch (e) {
    setBadge('RECONNECTING', 'fb');
  } finally {
    inflight = false;
  }
}

function stopLive() {
  if (sitTimer) { clearInterval(sitTimer); sitTimer = 0; }
  if (frameTimer) { clearInterval(frameTimer); frameTimer = 0; }
}

function startLive() {
  stopLive();
  setBadge('CONNECTING');
  pumpFrame();
  pollSit();
  frameTimer = setInterval(pumpFrame, 200);
  sitTimer = setInterval(pollSit, 1200);
  if (QoreCinema) QoreCinema.keepAwake({ on: true }).catch(() => {});
  if (QoreBackground) QoreBackground.requestNotify().catch(() => {});
}

function connectToHost(hostPort) {
  const cleaned = String(hostPort || '').replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  if (!cleaned) return;
  hostUrl = 'http://' + cleaned;
  localStorage.setItem('qoresence_host', cleaned);
  document.getElementById('pair').classList.add('hide');
  startLive();
}

if (QoreCinema && QoreCinema.addListener) {
  QoreCinema.addListener('pipChanged', (ev) => {
    setPipUi(!!(ev && ev.active));
    if (ev && ev.active) pumpFrame();
  }).catch(() => {});
}

if (App) {
  App.addListener('appStateChange', ({ isActive }) => {
    appBackgrounded = !isActive;
    if (isActive && QoreBackground) {
      QoreBackground.stopForeground().catch(() => {});
      if (QoreCinema && QoreCinema.isPip) {
        QoreCinema.isPip().then((r) => setPipUi(!!(r && r.active))).catch(() => {});
      } else {
        setPipUi(false);
      }
      pumpFrame();
    } else if (!isActive && QoreBackground && hostUrl) {
      if (QoreCinema && QoreCinema.isPip) {
        QoreCinema.isPip().then((r) => {
          setPipUi(!!(r && r.active));
          if (!(r && r.active)) QoreBackground.startForeground({ url: hostUrl }).catch(() => {});
        }).catch(() => {
          QoreBackground.startForeground({ url: hostUrl }).catch(() => {});
        });
      } else {
        QoreBackground.startForeground({ url: hostUrl }).catch(() => {});
      }
    }
  });
}

const pair = document.getElementById('pair');
const pairMsg = document.getElementById('pairMsg');
const pairHosts = document.getElementById('pairHosts');
function addHostButton(name, host, port) {
  const item = document.createElement('div');
  item.className = 'host-item';
  item.textContent = name || (host + ':' + port);
  item.onclick = () => connectToHost(host + ':' + port);
  pairHosts.appendChild(item);
}
async function scanMdns() {
  pairHosts.innerHTML = '';
  pairMsg.textContent = 'Scanning Wi-Fi for Qoresence…';
  pair.classList.remove('show-manual');
  if (QoreMdns) {
    try {
      const result = await QoreMdns.discover({ timeoutMs: 4000 });
      const hosts = result.hosts || [];
      if (hosts.length > 0) {
        pairMsg.textContent = hosts.length + ' Qoresence found on Wi-Fi.';
        hosts.forEach(h => addHostButton(h.name, h.host, h.port));
      } else {
        pairMsg.textContent = 'No Qoresence found. Start --play --deck --deck-bind 0.0.0.0 on the PC, or enter the address manually.';
        pair.classList.add('show-manual');
      }
    } catch (e) {
      pairMsg.textContent = 'Scan failed. Enter the PC address manually.';
      pair.classList.add('show-manual');
    }
  } else {
    pairMsg.textContent = 'Manual pairing. Enter the PC address shown on the Deck.';
    pair.classList.add('show-manual');
  }
}
function showPair() {
  stopLive();
  hostUrl = '';
  pair.classList.remove('hide');
  scanMdns();
}
document.getElementById('pairToggleManual').onclick = () => pair.classList.toggle('show-manual');
document.getElementById('pairManualGo').onclick = () => {
  const v = (document.getElementById('pairInput').value || '').trim();
  if (v) connectToHost(v);
};
document.getElementById('pairRescan').onclick = scanMdns;
document.getElementById('btnPair').onclick = () => {
  localStorage.removeItem('qoresence_host');
  showPair();
};
document.getElementById('btnPip').onclick = () => {
  if (QoreCinema) QoreCinema.enterPip().catch(() => {});
};
document.getElementById('btnClip').onclick = async () => {
  if (!hostUrl) return;
  try {
    const r = await fetch(hostUrl + '/api/clip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seconds: 12 })
    });
    const d = await r.json();
    setBadge(d && d.ok ? 'CLIP SAVED ON PC' : 'CLIP WAITING', d && d.ok ? '' : 'fb');
    if (Haptics) Haptics.impact({ style: 'MEDIUM' }).catch(() => {});
  } catch (e) {
    setBadge('CLIP FAILED', 'fb');
  }
};

(function boot() {
  const stored = localStorage.getItem('qoresence_host') || '';
  if (stored) connectToHost(stored);
  else showPair();
})();
</script>
</body>
</html>
