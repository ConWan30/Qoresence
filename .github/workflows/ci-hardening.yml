# Release hardening gate: localhost Deck, soak, latency unit tests, optional pip-audit
name: CI Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (minimal + test)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Security + soak + latency tests
        run: |
          python -m pytest \
            tests/test_security_localhost.py \
            tests/test_soak_synthetic.py \
            tests/test_a2a_policy.py \
            tests/test_frame_hub.py \
            tests/test_input_ring.py \
            -q --tb=short

      - name: Release checklist script
        run: python scripts/check_release_hardening.py


      - name: Deck SPA smoke + heavy-module gate
        run: |
          python scripts/check_glass_spa.py
          python scripts/check_heavy_modules.py
          python -m pip install -q fastapi httpx
          python scripts/smoke_deck_spa_http.py

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit || true
