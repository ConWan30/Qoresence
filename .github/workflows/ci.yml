name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 \
            curl build-essential

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash -s -- --version 16.0.0
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Install Node.js for snarkjs
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install snarkjs globally
        run: npm install -g snarkjs

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package with trio extras
        run: |
          pip install --upgrade pip
          pip install -e ".[trio,test]"

      - name: Copy WASM applet for tests
        run: |
          # In CI, we use a minimal mock WASM or skip real WASM tests
          mkdir -p test_artifacts
          # The test suite uses mocked WASM runner, so no real WASM needed

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -x

      - name: Run trio-retina tests specifically
        run: |
          python -m pytest tests/test_trio_retina.py -v --tb=short

      - name: Check imports
        run: |
          python -c "from qoresence.trio import TrioRetinaConfig, EvmLogPayload, build_evm_log_payload, WasmtimeRunner, TrioRetinaValidator; print('All trio imports OK')"
          python -c "from qoresence.cli import create_config_from_args, QoresenceApp; print('CLI imports OK')"

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[trio]"

      - name: Ruff check
        run: |
          ruff check qoresence/ tests/ scripts/

      - name: Ruff format check
        run: |
          ruff format --check qoresence/ tests/ scripts/

      - name: Mypy type check
        run: |
          mypy qoresence/ --ignore-missing-imports || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: qoresence:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image dry-run
        run: |
          docker run --rm qoresence:latest --dry-run --trio --trio-wasm-path=/app/w3bstream_applet.wasm --trio-validate-on-flush

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[trio]"

      - name: Run benchmarks
        run: |
          python scripts/benchmark.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 30