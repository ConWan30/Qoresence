name: assemble-readme-once
on:
  push:
    branches: [docs/qoresence-live-x-glass]
    paths: ['docs/_assemble/**', '.github/workflows/assemble-readme.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/qoresence-live-x-glass
      - name: Concatenate README parts
        run: |
          cat docs/_assemble/00.md docs/_assemble/01.md docs/_assemble/02.md > README.md
          wc -c README.md
          grep -q 'Built for operators who want local' README.md
          grep -q 'Qoresence Live 0.9.0' README.md
          grep -q 'docs/X_GLASS.md' README.md
      - name: Commit restored README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "docs: restore full README.md Live 0.9.0 X Glass product face"
          git push
