name: Build Windows package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { $version = "dev-${{ github.run_number }}" }
          .\scripts\package_windows.ps1 -OutputDirectory dist -Version $version

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qoresence-Windows
          path: |
            dist/Qoresence-Windows.zip
            dist/Qoresence-Windows.zip.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Qoresence-Windows.zip
            dist/Qoresence-Windows.zip.sha256
