<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retina Rail — LIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#0A0E14;color:#E8EDF0;display:flex;justify-content:flex-end;min-height:100vh}
#rail{width:360px;min-height:100vh;background:rgba(10,14,20,.88);backdrop-filter:blur(16px);border-left:1px solid rgba(232,237,240,.12);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:-16px 0 48px rgba(0,0,0,.45)}
.card{background:rgba(232,237,240,.07);border:1px solid rgba(232,237,240,.10);border-radius:14px;padding:12px 14px}
.card h3{font:600 11px/1 JetBrains Mono,monospace;letter-spacing:.08em;color:rgba(232,237,240,.62);margin-bottom:8px;text-transform:uppercase}
#strip{font:600 13px/1.4 JetBrains Mono,monospace;min-height:18px}#strip.wait{color:rgba(232,237,240,.55);font-weight:500}
#lat{font:500 11px/1 JetBrains Mono,monospace;color:rgba(232,237,240,.55);margin-top:6px}
#feed{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}#feed.empty::before{content:"No clutch moments yet — play on field to trigger.";color:rgba(232,237,240,.45);font:500 11px/1.4 Inter,sans-serif;padding:6px}
.item{padding:9px 10px;border-radius:10px;background:rgba(245,197,66,.10);border:1px solid rgba(245,197,66,.18);font:500 12px/1.4 Inter,sans-serif}
#foundry{width:100%;padding:12px;border-radius:12px;border:0;background:#F5C542;color:#0A0E14;font:700 13px/1 Inter,sans-serif;cursor:pointer}
#trail{font:500 11px/1 JetBrains Mono,monospace;color:rgba(232,237,240,.55);display:flex;justify-content:space-between;margin-top:4px}
a{color:#F5C542;text-decoration:none}
</style></head><body>
<div id="rail">
  <div class="card"><h3>Situation — LIVE</h3><div id="strip" class="wait">Waiting for HDMI — run python -m qoresence.cli --play</div><div id="lat">deck live — polling /api/situation every 2s</div></div>
  <div class="card"><h3>Clutch Feed — last 3</h3><div id="feed" class="empty"></div></div>
  <div class="card"><h3>Foundry</h3><button id="foundry">Make Clip (last 30s)</button><div style="margin-top:8px;font:500 11px/1.3 JetBrains Mono,monospace;color:rgba(232,237,240,.55)">Helix clip + trail <code id="hash">—</code></div></div>
  <div id="trail"><span id="t1">● waiting</span><span>trio-retina 30s</span><span id="t3">eval 1.0</span></div>
  <small style="text-align:center;display:block"><a href="/overlay.html" target="_blank">Lens</a> · <a href="/health">health</a> · <a href="/api/situation">api</a></small>
</div>
<script>
const strip=document.getElementById('strip'),lat=document.getElementById('lat'),feed=document.getElementById('feed'),t1=document.getElementById('t1');
function isLive(s){return s && (s.score_home!=null||s.score_away!=null||s.quarter||s.down||s.clock||Object.keys(s).length>2);}
function fmt(s){if(!isLive(s)) return null; const sc=s.score_home!=null?s.score_home+'-'+s.score_away:(s.score||''); const q=s.quarter||'',down=s.down,dist=s.distance,yl=s.yard_line||'',clock=s.clock||'',wp=s.win_prob; const parts=[]; if(sc) parts.push(sc); if(q) parts.push(q+(clock?' '+clock:'')); if(down) parts.push(down+' & '+(dist||'')); if(yl) parts.push('@ '+yl); if(wp!=null) parts.push('WP '+Math.round(wp*100)+'%'); return parts.join(' \u00b7 ')||JSON.stringify(s).slice(0,90);}
function addMoment(p){feed.classList.remove('empty'); const d=document.createElement('div'); d.className='item'; d.textContent=(p.clock||'now')+' '+(p.title||'CLUTCH')+' · '+(p.reason||''); feed.prepend(d); while(feed.children.length>3) feed.removeChild(feed.lastChild);}
function applySnap(snap,latMs){
  if(snap && snap.situation && isLive(snap.situation)){ strip.textContent=fmt(snap.situation); strip.classList.remove('wait'); if(latMs!=null) lat.textContent=latMs.toFixed(2)+'ms p50 \u00b7 local ONNX \u2014 live'; t1.textContent='\u25cf live '+(latMs!=null?latMs.toFixed(1)+'ms':''); }
  else if(snap && snap.situation){ strip.textContent='Waiting for HDMI — on field to populate score/down'; strip.classList.add('wait'); }
  if(snap && snap.moments){ feed.innerHTML=''; if(snap.moments.length===0) feed.classList.add('empty'); else snap.moments.slice(-3).forEach(addMoment); }
}
function handle(m){
  const snap=m.state||m.snapshot||(m.situation?m:null);
  if(m.type==='snapshot'){ applySnap(m, m.latency_ms); return; }
  if(snap && (snap.situation||snap.state)) applySnap(snap, m.latency_ms||snap.latency_ms);
  else if(m.situation||m.payload){ const s=m.situation||m.payload; if(isLive(s)){ strip.textContent=fmt(s); strip.classList.remove('wait'); }}
  if(m.type==='moment'&&m.payload) addMoment(m.payload);
}
function connect(){try{ const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/retina'); ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch{}}; ws.onclose=()=>setTimeout(connect,1200);}catch{setTimeout(connect,1200)}}
connect();
setInterval(()=>{fetch('/api/situation').then(r=>r.json()).then(j=>{ if(j) handle({state:j.state||j});}).catch(()=>{});},2000);
document.getElementById('foundry').onclick=()=>{fetch('/api/situation').then(r=>r.json()).then(j=>{ addMoment({title:'CLIP queued',clock:'now'});}).catch(()=>addMoment({title:'CLIP queued',clock:'now'}));};
</script></body></html>
