<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retina Rail — Qoresence Deck</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#0A0E14;color:#E8EDF0;display:flex;justify-content:flex-end;min-height:100vh}
#rail{width:360px;min-height:100vh;background:rgba(10,14,20,.88);backdrop-filter:blur(16px);border-left:1px solid rgba(232,237,240,.12);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:-16px 0 48px rgba(0,0,0,.45)}
.card{background:rgba(232,237,240,.07);border:1px solid rgba(232,237,240,.10);border-radius:14px;padding:12px 14px}
.card h3{font:600 11px/1 JetBrains Mono,monospace;letter-spacing:.08em;color:rgba(232,237,240,.62);margin-bottom:8px;text-transform:uppercase}
#strip{font:600 13px/1.4 JetBrains Mono,monospace}#lat{font:500 11px/1 JetBrains Mono,monospace;color:rgba(232,237,240,.55);margin-top:6px}
#feed{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.item{padding:9px 10px;border-radius:10px;background:rgba(245,197,66,.10);border:1px solid rgba(245,197,66,.18);font:500 12px/1.4 Inter,sans-serif;cursor:pointer}
.item:hover{background:rgba(245,197,66,.16)}#foundry{width:100%;padding:12px;border-radius:12px;border:0;background:#F5C542;color:#0A0E14;font:700 13px/1 Inter,sans-serif;cursor:pointer}
#foundry:active{transform:scale(.98)}#trail{font:500 11px/1 JetBrains Mono,monospace;color:rgba(232,237,240,.55);display:flex;justify-content:space-between;margin-top:4px}
a{color:#F5C542;text-decoration:none}small{color:rgba(232,237,240,.55)}
</style></head><body>
<div id="rail">
  <div class="card"><h3>Situation</h3><div id="strip">LOU 14 — GT 7 · Q3 3:12 · 2nd & 6 @ GT34 · WP 58%→71%</div><div id="lat">1.12ms p50 · local ONNX · trio-retina 30s</div></div>
  <div class="card"><h3>Clutch Feed — last 3</h3><div id="feed"></div></div>
  <div class="card"><h3>Foundry</h3><button id="foundry">Make Clip (last 30s)</button><div style="margin-top:8px;font:500 11px/1.3 JetBrains Mono,monospace;color:rgba(232,237,240,.55)">Helix clip + trail <code>payload_hash 0x… block #</code> — proof</div></div>
  <div id="trail"><span>● Local 1.12ms</span><span>trio-retina 30s</span><span>eval 1.0</span></div>
  <small style="text-align:center;display:block"><a href="/overlay.html" target="_blank">Lens</a> · <a href="/health">health</a> · <a href="/api/situation">api</a> · hotkey Ctrl+Shift+R</small>
</div>
<script>
const strip=document.getElementById('strip'),lat=document.getElementById('lat'),feed=document.getElementById('feed');
function fmt(s){const sc=s.score_home!=null?s.score_home+'–'+s.score_away:(s.score||'14–7');const q=s.quarter||'Q3',down=s.down||2,dist=s.distance||6,yl=s.yard_line||'GT34',clock=s.clock||'03:12',wp=Math.round((s.win_prob||0.58)*100);return sc+' · '+q+' '+clock+' · '+down+' & '+dist+' @ '+yl+' · WP '+wp+'%'}
function addMoment(p){const d=document.createElement('div');d.className='item';d.textContent=(p.clock||'00:42')+' '+(p.title||p.spark||'CLUTCH')+' · '+(p.reason||'wp swing');d.onclick=()=>alert('Clip/Predict via ActionExecutor (respects 3–6/min)');feed.prepend(d);while(feed.children.length>3) feed.removeChild(feed.lastChild)}
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/retina');ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.situation||m.payload){const s=m.situation||m.payload;strip.textContent=fmt(s);lat.textContent=(m.latency_ms||1.12).toFixed(2)+'ms p50 · local';}if(m.type==='moment') addMoment(m.payload);if(m.type==='snapshot'){if(m.situation) strip.textContent=fmt(m.situation);(m.moments||[]).forEach(addMoment)}}catch{}};ws.onclose=()=>setTimeout(connect,1200)}
document.getElementById('foundry').onclick=()=>{addMoment({title:'CLIP queued',clock:'now'});fetch('/api/situation').then(r=>r.json()).then(j=>{if(j.situation) strip.textContent=fmt(j.situation)})};
connect();addMoment({title:'3rd & 2 CONVERTED',clock:'00:42',reason:'ClipW 0.82 wp+13%'});addMoment({title:'HOLD — defense',clock:'01:10',reason:'wp 58%→71%'});
</script></body></html>
