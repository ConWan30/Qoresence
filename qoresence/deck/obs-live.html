<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qoresence HDMI — Pattern B</title>
<style>
/* Pattern B pixels for OBS Browser Source (CEF). Raw /video MJPEG often stays
   black in CEF; wrap it in HTML and keep brand paint when the feed is dark. */
@font-face{font-family:'Instrument Sans';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/instrument-sans-600.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/ibm-plex-mono-500.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/ibm-plex-mono-600.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05060A;color:#E8EAF2;
  font-family:'Instrument Sans',system-ui,sans-serif}
#stage{position:absolute;inset:0;background:#000}
#feed{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;
  image-rendering:auto}
#veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(5,6,10,.18) 0%,rgba(5,6,10,.55) 100%)}
#brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:2;pointer-events:none;
  padding:22px 36px;border-radius:12px;
  background:rgba(5,6,10,.72);border:1px solid rgba(155,231,255,.28);
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(14px)}
#brand .mark{font:600 11px/1 'IBM Plex Mono',ui-monospace,monospace;
  letter-spacing:.18em;color:#9BE7FF;margin-bottom:10px}
#brand .title{font:600 42px/.98 'Instrument Sans',system-ui,sans-serif;
  letter-spacing:-.02em;color:#E8EAF2;text-shadow:0 0 28px rgba(155,231,255,.22)}
#brand .sub{margin-top:12px;font:500 13px/1.35 'IBM Plex Mono',ui-monospace,monospace;
  letter-spacing:.08em;color:#8B90A0;text-transform:uppercase}
#corner{position:absolute;left:22px;bottom:18px;z-index:2;pointer-events:none;
  font:500 10px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;
  color:rgba(139,144,160,.85);padding:7px 11px;border-radius:6px;
  background:rgba(5,6,10,.65);border:1px solid rgba(139,144,160,.22)}
#corner strong{color:#9BE7FF;font-weight:600}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important}}
</style>
</head><body>
<div id="stage">
  <img id="feed" alt="Qoresence HDMI LIVE" decoding="async" draggable="false">
  <div id="veil" aria-hidden="true"></div>
  <div id="brand" aria-live="polite">
    <div class="mark">PATTERN B · OBS → X LIVE</div>
    <div class="title">QORESENCE</div>
    <div class="sub">HDMI PORT · USB3.0 VIDEO · PATTERN B</div>
  </div>
  <div id="corner">Deck <strong>/obs-live.html</strong> · feed <strong>/video?fps=60</strong></div>
</div>
<script>
(function () {
  const feed = document.getElementById('feed');
  const FPS = 60;
  function arm() {
    // Bust CEF cache; multipart MJPEG via <img> (not navigating to /video alone).
    feed.src = '/video?fps=' + FPS + '&t=' + Date.now();
  }
  feed.addEventListener('error', function () {
    setTimeout(arm, 1200);
  });
  arm();
})();
</script>
</body></html>
