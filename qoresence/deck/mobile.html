<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/glass-192.png">
<title>Qoresence · Mobile Glass</title>
<style>
/* Aperture Glass — self-hosted woff2, no runtime Google Fonts. */
@font-face{font-family:'Instrument Sans';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/instrument-sans-400.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/instrument-sans-500.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/instrument-sans-600.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/ibm-plex-mono-500.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/ibm-plex-mono-600.woff2') format('woff2')}
:root{--bg:#05060a;--ink:#e8eaf2;--dim:#8b90a0;--lime:#9be7ff;--cyan:#9be7ff;--amber:#d7b36a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;position:relative;background:#000;min-height:40vh}
#rtc,#mjpeg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#mjpeg{display:none}
#stage.mjpeg #rtc{display:none}
#stage.mjpeg #mjpeg{display:block}
#badge{position:absolute;left:10px;top:10px;z-index:2;font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;background:rgba(5,6,10,.78);border:1px solid rgba(155,231,255,.35);border-radius:999px;padding:7px 11px}
#badge.fb{border-color:rgba(215,179,106,.45);color:var(--amber)}
#strip{flex:0 0 auto;padding:10px 14px 14px;background:linear-gradient(180deg,rgba(5,6,10,.2),#05060a)}
#prov{font:600 10px/1.3 ui-monospace,monospace;color:var(--dim);letter-spacing:.04em;margin-bottom:8px}
#row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
#score{font:600 22px/1 'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#meta{font:600 12px/1.3 ui-monospace,monospace;color:var(--dim)}
#meta strong{color:var(--lime);font-weight:700}
#wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:600 14px/1.45 system-ui;color:var(--ink);background:rgba(5,6,10,.72);z-index:3}
#wait.hide{display:none}
#wait small{display:block;margin-top:8px;color:var(--dim);font-size:12px}
#pair{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:var(--bg);z-index:5;gap:18px}
#pair.hide{display:none}
#pair h1{font:600 26px/1.1 'Instrument Sans',system-ui,sans-serif;letter-spacing:-.03em;color:var(--lime)}
#pair p{font:500 13px/1.5 system-ui;color:var(--dim);max-width:320px}
#pair .dot{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
#pair .host{font:700 15px/1.3 ui-monospace,monospace;color:var(--cyan);background:rgba(155,231,255,.08);border:1px solid rgba(155,231,255,.3);border-radius:10px;padding:10px 14px;max-width:90vw;overflow:auto}
#pair button{font:700 14px/1 system-ui;color:var(--bg);background:var(--lime);border:none;border-radius:999px;padding:14px 28px;letter-spacing:.02em;cursor:pointer}
#pair button:active{transform:translateY(1px)}
#pair input{font:600 15px/1 ui-monospace,monospace;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(155,231,255,.25);border-radius:10px;padding:12px 14px;width:220px;text-align:center}
#pair .manual{display:none;flex-direction:column;gap:12px;align-items:center}
#pair.show-manual .manual{display:flex}
#pair .switch{font:600 12px/1 system-ui;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none;padding:4px}
</style>
</head>
<body>
<div id="pair" class="hide">
  <h1>Qoresence Glass</h1>
  <div id="pairStatus"><span class="dot"></span></div>
  <p id="pairMsg">Looking for Qoresence on this Wi-Fi…</p>
  <div id="pairHost" class="host" style="display:none"></div>
  <button id="pairGo" style="display:none">Connect</button>
  <div class="manual" id="pairManual">
    <input id="pairInput" type="text" inputmode="decimal" placeholder="192.168.1.10:8765" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="pairManualGo">Connect manually</button>
  </div>
  <button class="switch" id="pairToggleManual">Enter address manually</button>
</div>
<div id="stage">
  <div id="badge">CONNECTING</div>
  <video id="rtc" playsinline autoplay muted></video>
  <img id="mjpeg" alt="LIVE MJPEG fallback" decoding="async">
  <div id="wait">Waiting for FrameHub…<small>Run --play --deck on the PC. Phone is a view only.</small></div>
</div>
<div id="strip">
  <div id="prov">FrameHub glass · no second capture</div>
  <div id="row">
    <div id="score">—</div>
    <div id="meta">frame <strong id="hasf">—</strong> · title <strong id="title">—</strong> · lock <strong id="lock">—</strong></div>
  </div>
</div>
<script>
const stage=document.getElementById('stage');
const rtc=document.getElementById('rtc');
const mjpeg=document.getElementById('mjpeg');
const badge=document.getElementById('badge');
const wait=document.getElementById('wait');
const scoreEl=document.getElementById('score');
const hasf=document.getElementById('hasf');
const titleEl=document.getElementById('title');
const lockEl=document.getElementById('lock');
let pc=null;

function setBadge(text, fallback){
  badge.textContent=text;
  badge.className=fallback?'fb':'';
}
function showWait(on){ wait.classList.toggle('hide', !on); }
function sitFrom(m){
  if(!m||typeof m!=='object') return {};
  if(m.situation&&typeof m.situation==='object') return m.situation;
  if(m.payload&&typeof m.payload==='object') return m.payload;
  return m;
}
function paintStrip(snap){
  const s=sitFrom(snap);
  const vid=snap&&snap.video?snap.video:{};
  const hf=!!(vid.has_frame||s.has_frame);
  hasf.textContent=hf?'yes':'—';
  const prof=s.game_profile||s.game_title||'';
  titleEl.textContent=prof?String(prof):'—';
  const locked=!!(s.score_vlm_locked||s.scoreboard_locked||s.title_claim);
  lockEl.textContent=locked?'locked':'—';
  const hs=s.home_score, as=s.away_score;
  if(hs!=null&&as!=null&&locked){
    scoreEl.textContent=hs+' – '+as;
  }else{
    scoreEl.textContent='—';
  }
  if(hf) showWait(false);
}
async function pollSit(){
  try{
    const r=await fetch('/api/situation');
    paintStrip(await r.json());
  }catch(e){}
}
function fallbackMjpeg(){
  try{ if(pc){ pc.close(); } }catch(e){}
  pc=null;
  try{ rtc.srcObject=null; }catch(e){}
  stage.classList.add('mjpeg');
  mjpeg.src='/video?fps=20&t='+Date.now();
  setBadge('LIVE · MJPEG (fallback)', true);
  showWait(false);
}
async function startRtc(){
  setBadge('CONNECTING');
  try{
    const st=await fetch('/api/webrtc/status').then(r=>r.json());
    if(!st||!st.available){
      fallbackMjpeg();
      return;
    }
    const conn=new RTCPeerConnection({iceServers:[]});
    pc=conn;
    conn.ontrack=function(ev){
      if(ev.streams&&ev.streams[0]){
        rtc.srcObject=ev.streams[0];
        stage.classList.remove('mjpeg');
        setBadge('LIVE · WebRTC');
        showWait(false);
      }
    };
    conn.onconnectionstatechange=function(){
      if(conn.connectionState==='failed'||conn.connectionState==='disconnected'){
        fallbackMjpeg();
      }
    };
    conn.addTransceiver('video',{direction:'recvonly'});
    const offer=await conn.createOffer();
    await conn.setLocalDescription(offer);
    const ans=await fetch('/api/webrtc/offer',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sdp:conn.localDescription.sdp,type:conn.localDescription.type,fps:30,max_width:960})
    }).then(r=>r.json());
    if(!ans||!ans.ok||!ans.sdp){
      fallbackMjpeg();
      return;
    }
    await conn.setRemoteDescription({type:ans.type||'answer',sdp:ans.sdp});
  }catch(e){
    fallbackMjpeg();
  }
}
startRtc();
pollSit();
setInterval(pollSit,1500);

// --- Service worker (PWA shell) ---
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// --- First-run pairing (mDNS auto-discovery) ---
// This page is served BY the deck, so all live URLs are relative
// ('/video', '/api/situation', '/api/webrtc/...'). The pairing gate is only
// useful when this shell is loaded from a non-deck origin (e.g. a bundled
// native WebView or a file://). When served from the deck over http(s) with a
// real host, we are already connected — skip the gate and go straight to live.
(function(){
  const pair=document.getElementById('pair');
  if(!pair) return;
  // Already on the deck: relative URLs work, no pairing needed.
  const servedFromDeck =
    (location.protocol==='http:'||location.protocol==='https:') &&
    !!location.host;
  if(servedFromDeck){
    // Remember the origin for home-screen launches that may reuse the SW shell.
    try{ localStorage.setItem('qoresence_host',location.host); }catch(e){}
    return;
  }
  const pairMsg=document.getElementById('pairMsg');
  const pairHost=document.getElementById('pairHost');
  const pairGo=document.getElementById('pairGo');
  const pairToggle=document.getElementById('pairToggleManual');
  const pairManualGo=document.getElementById('pairManualGo');
  const pairInput=document.getElementById('pairInput');
  const params=new URLSearchParams(location.search);
  const qHost=(params.get('host')||'').trim();
  const stored=localStorage.getItem('qoresence_host')||'';
  if(qHost){
    localStorage.setItem('qoresence_host',qHost);
    return; // already paired via mDNS redirect
  }
  if(stored){
    return; // returning user — straight to live glass
  }
  // First run — show pairing screen.
  pair.classList.remove('hide');
  pairGo.style.display='none';
  pairToggle.onclick=()=>pair.classList.toggle('show-manual');
  pairManualGo.onclick=()=>{
    const v=(pairInput.value||'').trim();
    if(!v) return;
    localStorage.setItem('qoresence_host',v);
    pair.classList.add('hide');
  };
  // Try mDNS discovery via the deck's /api/discover endpoint.
  fetch('/api/discover').then(r=>r.json()).then(d=>{
    if(d&&d.lan&&d.url){
      pairMsg.textContent='Found Qoresence on this Wi-Fi.';
      pairHost.textContent=d.name||d.host;
      pairHost.style.display='block';
      pairGo.style.display='inline-block';
      pairGo.onclick=()=>{
        localStorage.setItem('qoresence_host',d.host+':'+d.port);
        pair.classList.add('hide');
      };
    }else{
      pairMsg.textContent='No Qoresence found on Wi-Fi yet. Start --play --deck on the PC, or enter the address manually.';
      pair.classList.add('show-manual');
    }
  }).catch(()=>{
    pairMsg.textContent='Could not reach discovery. Enter the PC address manually.';
    pair.classList.add('show-manual');
  });
})();
</script>
</body>
</html>
