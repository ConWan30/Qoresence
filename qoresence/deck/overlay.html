<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retina Lens — LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
:root{--ink:#050a08;--paper:#E8F2EC;--muted:#8EA396;--dim:#5D7166;--lime:#C6F26A;--cyan:#4FE0D4;--amber:#FFC14A;--rose:#FF7D91}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Syne,IBM Plex Mono,system-ui,sans-serif}
#ribbon{position:absolute;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,#17332B 0%,var(--cyan) 42%,var(--lime) 100%);opacity:.12;transition:opacity .8s;box-shadow:0 0 18px rgba(104,217,232,.35)}
#pill{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(8,11,16,.78);backdrop-filter:blur(16px);border:1px solid rgba(200,242,106,.38);border-radius:999px;padding:11px 22px;color:var(--paper);font:700 13px/1 JetBrains Mono,monospace;letter-spacing:.04em;box-shadow:0 14px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);opacity:0;transition:opacity .8s;white-space:nowrap}
#pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 13px var(--lime)}
#pill.show{opacity:1}#pill.hide{opacity:0}
#spark{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%) scale(.88);font:800 82px/.98 Syne,sans-serif;letter-spacing:-.065em;color:var(--lime);text-align:center;text-shadow:0 10px 42px rgba(198,242,106,.32);opacity:0;transition:all .55s cubic-bezier(.34,1.56,.64,1);filter:saturate(1.05)}
#spark.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#eye{position:absolute;right:22px;top:16px;padding:8px 11px;border:1px solid rgba(190,214,232,.2);border-radius:10px;background:rgba(8,11,16,.72);backdrop-filter:blur(13px);color:var(--muted);font:700 10px/1 JetBrains Mono,monospace;letter-spacing:.05em;box-shadow:0 10px 24px rgba(0,0,0,.2)}
#eye strong{color:var(--lime);font-weight:800}
#body,#pad,#bind{position:absolute;right:22px;padding:7px 11px;border-radius:10px;background:rgba(8,11,16,.72);backdrop-filter:blur(13px);font:700 10px/1 JetBrains Mono,monospace;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .35s;pointer-events:none}
#body{top:52px;border:1px solid rgba(79,224,212,.4);color:var(--cyan)}
#pad{top:88px;border:1px solid rgba(190,214,232,.22);color:var(--muted)}
#bind{top:124px;border:1px solid rgba(198,242,106,.35);color:var(--lime)}
#body.show,#pad.show,#bind.show{opacity:1}
#wait{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(570px,80vw);padding:18px 23px;color:var(--paper);font:700 15px/1.45 Inter,sans-serif;text-align:center;background:rgba(8,11,16,.86);backdrop-filter:blur(17px);border:1px solid rgba(104,217,232,.35);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.06);z-index:9}
#wait::before{content:"RETINA LENS / ";color:var(--cyan);font:800 9px/1 JetBrains Mono,monospace;letter-spacing:.14em;margin-right:8px}
#wait.connected{background:rgba(8,11,16,.78);color:var(--muted);border-color:rgba(200,242,106,.28);font-weight:500;font-size:14px}
#wait.connected::before{color:var(--lime)}
@media(max-width:900px){#eye{right:12px;top:12px}#pill{bottom:5%;max-width:88vw;overflow:hidden;text-overflow:ellipsis;font-size:11px}#spark{font-size:56px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important}}
</style></head><body>
<div id="ribbon"></div><div id="pill" class="hide">Waiting for game — run --play</div><div id="spark"></div><div id="eye">● <strong>waiting</strong> — no game</div><div id="body" aria-live="polite"></div><div id="pad" aria-live="polite"></div><div id="bind" aria-live="polite"></div><div id="wait">OBS URL must be http://127.0.0.1:8765/overlay.html (not file://) · then: python -m qoresence.cli --play</div>
<script>
const ribbon=document.getElementById('ribbon'),pill=document.getElementById('pill'),spark=document.getElementById('spark'),eye=document.getElementById('eye'),wait=document.getElementById('wait'),bodyChip=document.getElementById('body'),padChip=document.getElementById('pad'),bindChip=document.getElementById('bind');
let lastLiveNs=0, wsOk=false, lastSit=null;
// Scorebug / HUD numbers — without these the pill stays hidden (no fake 0-0).
function hasBoard(s){
  if(!s||typeof s!=='object') return false;
  return s.home_score!=null||s.away_score!=null||s.score_home!=null||s.score_away!=null
    ||s.quarter!=null||s.down!=null||s.clock!=null||s.game_clock_seconds!=null
    ||s.kills!=null||s.health!=null||s.win_prob!=null;
}
// Classifier sees a game (may still have null scores).
function isClassified(s){
  if(!s||typeof s!=='object') return false;
  return s.game_state==='gameplay'||s.game_category==='football'||s.game_category==='shooter'||hasBoard(s);
}
function isLive(s){ return isClassified(s); }
function fmtClock(s){
  if(s.clock!=null&&s.clock!=='') return String(s.clock);
  if(s.game_clock_seconds==null) return '';
  const sec=Number(s.game_clock_seconds)|0;
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function setRibbon(wp,clip){const pct=Math.round((wp||0)*100);ribbon.style.background='linear-gradient(90deg,#1A3A2A 0%,#F5C542 '+pct+'%,#E8EDF0 100%)';ribbon.style.opacity=(0.08+(clip||0)*0.6).toFixed(2)}
function setPill(t,show){pill.textContent=t;pill.className=show?'show':'hide'}
function setSpark(w,icon){spark.textContent=(icon||'⚡')+' '+(w||'');spark.className='show';setTimeout(()=>spark.className='',2600)}
function setEye(html){eye.innerHTML=html}
function hideWait(){wait.style.display='none'}
function showWait(msg, bad){
  wait.textContent=msg;
  wait.style.display='block';
  if(bad){wait.style.background='rgba(231,76,60,.95)';wait.style.color='#fff';wait.classList.remove('connected')}
  else{wait.style.background='';wait.style.color='';wait.classList.add('connected')}
}
function handle(m){
  // Accept snapshot | situation | raw state shapes from WS + /api/situation poll.
  const snap=(m&&m.type==='snapshot')?m:(m.state||m.snapshot||null);
  let s={};
  if(snap&&snap.situation) s=snap.situation;
  else if(m&&m.situation) s=m.situation;
  else if(m&&m.payload&&typeof m.payload==='object'&&!Array.isArray(m.payload)) s=m.payload;
  else if(m&&m.game_state!=null) s=m;
  lastSit=s;
  const lat=m.latency_ms!=null?m.latency_ms:(snap&&snap.latency_ms!=null?snap.latency_ms:null);
  const upd=m.updated_ns!=null?m.updated_ns:(snap&&snap.updated_ns);
  if(upd) lastLiveNs=upd;

  if(isLive(s)){
    hideWait();
    const cat=s.game_category||s.game_state||'live';
    const conf=s.visual_confidence!=null?(' · '+(Number(s.visual_confidence)*100|0)+'%'):'';
    if(hasBoard(s)){
      const sc=s.score_home!=null? (s.score_home+'-'+s.score_away) : (s.home_score!=null? (s.home_score+'-'+s.away_score) : (s.score!=null?String(s.score):''));
      const q=s.quarter!=null?('Q'+s.quarter):'';
      const down=s.down, dist=s.distance||s.yards_to_go, clock=fmtClock(s), wp=s.win_prob, cl=s.clip_worthiness||0;
      const parts=[]; if(sc!==''&&sc!=='null-null') parts.push(sc); if(q) parts.push(q+(clock?' '+clock:'')); if(down!=null) parts.push(down+' & '+(dist!=null?dist:'')); if(wp!=null) parts.push('WP '+Math.round(wp*100)+'%');
      setRibbon(wp||0,cl); setPill(parts.join(' · ')||'LIVE',true);
      setEye('● <strong>live</strong> '+cat+(lat!=null?(' '+(Number(lat).toFixed(1))+'ms'):'')+conf);
    } else {
      // Classified football/gameplay but scorebug still null — hide center wait + hide pill.
      setRibbon(0,0); setPill('',false);
      setEye('● <strong>live</strong> '+cat+' · no scorebug'+conf+(wsOk?'':' · http'));
    }
  } else {
    setRibbon(0,0); setPill('',false);
    if(wsOk){
      showWait('Retina connected — waiting for HDMI / classifier…', false);
      setEye('● <strong>connected</strong> :8765 · no game yet');
    } else {
      showWait('Retina live — waiting for Deck WS. Start: python -m qoresence.cli --play', false);
      setEye('● <strong>waiting</strong> — no game');
    }
  }
  if(m.type==='moment'&&m.payload&&m.payload.title) setSpark(m.payload.title.toUpperCase(),m.payload.icon||'⚡');
  paintPad((snap&&snap.controller)||m.controller||{});
}
function paintPad(ctrl){
  if(bodyChip){
    if(ctrl.imu_bodied){
      const ms=ctrl.imu_precursor_ms!=null?Math.round(Number(ctrl.imu_precursor_ms)):'';
      const nm=ctrl.imu_precursor_name?(' '+String(ctrl.imu_precursor_name).toUpperCase()):'';
      bodyChip.textContent='BODY'+(ms!==''&&!Number.isNaN(ms)?' −'+ms+'ms':'')+nm;
      bodyChip.classList.add('show');
    }else{
      bodyChip.textContent='';
      bodyChip.classList.remove('show');
    }
  }
  if(padChip){
    if(ctrl.waiting && !ctrl.connected){
      padChip.textContent='PAD WAIT';
      padChip.classList.add('show');
    }else if(ctrl.connected || ctrl.transport){
      padChip.textContent='PAD '+(ctrl.transport||'hid').toUpperCase()+(ctrl.reports!=null?(' · '+ctrl.reports):'');
      padChip.classList.add('show');
    }else{
      padChip.textContent='';
      padChip.classList.remove('show');
    }
  }
  if(bindChip){
    if(ctrl.last_bind_kind){
      const hid=ctrl.last_bind_hid?(' ← '+String(ctrl.last_bind_hid).toUpperCase()):'';
      const ms=ctrl.last_bind_ms!=null?(' '+Math.round(Number(ctrl.last_bind_ms))+'ms'):'';
      bindChip.textContent='BIND '+String(ctrl.last_bind_kind).toUpperCase()+hid+ms;
      bindChip.classList.add('show');
    }else{
      bindChip.textContent='';
      bindChip.classList.remove('show');
    }
  }
}
let ws=null;
function connect(){
  try{
    ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/retina');
    ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch{}};
    ws.onopen=()=>{
      wsOk=true;
      // Do not force the yellow "waiting for HDMI" over a live classified snapshot.
      if(isLive(lastSit)){ hideWait(); setEye('● <strong>live</strong> '+(lastSit.game_category||lastSit.game_state||'')+' · ws'); }
      else { showWait('Retina connected — waiting for HDMI / classifier…', false); setEye('● <strong>connected</strong> :8765'); }
    };
    ws.onclose=()=>{
      wsOk=false;
      showWait('● Deck DISCONNECTED — reconnecting…', true);
      setEye('● disconnected');
      setTimeout(connect,1200);
    };
  }catch(e){ setTimeout(connect,1200); }
}
connect();
// HTTP poll backup when WS is 403/down (same origin as Browser Source).
setInterval(()=>{
  fetch('/api/situation').then(r=>r.json()).then(j=>{
    if(!j) return;
    // /api/situation returns the snapshot object itself.
    handle(j.type==='snapshot'?j:{state:j, latency_ms:j.latency_ms, updated_ns:j.updated_ns});
  }).catch(()=>{});
},2000);
setInterval(()=>{
  fetch('/health').then(r=>r.json()).then(h=>{
    if(!h) return;
    const ctrl=Object.assign({}, (h.state&&h.state.controller)||{}, h.coupling||{});
    paintPad(ctrl);
  }).catch(()=>{});
},1500);
</script></body></html>
